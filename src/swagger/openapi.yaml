openapi: 3.0.0

info:
  title: API Documentation
  version: 1.0.0
  description: Production-ready API Documentation
  contact:
    name: API Support

servers:
  - url: http://localhost:3001/api/v1
    description: Local development server
  - url: ...
    description: Production server

tags:
  - name: Auth
  - name: Users

paths:
  # ---------- AUTH ----------
  /auth/login:
    post:
      tags: [Auth]
      summary: Login user
      description: Authenticate user and return JWT token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
              example:
                email: user@app.com
                password: 123456
      responses:
        200:
          $ref: "#/components/responses/SuccessAuth"
        400:
          $ref: "#/components/responses/BadRequest"

  # ---------- USERS ----------
  /users:
    get:
      tags: [Users]
      summary: Get all users (Admin only)
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/limit"
      responses:
        200:
          $ref: "#/components/responses/UserList"
        401:
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Users]
      summary: Create user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserCreate"
            example:
              name: John Doe
              email: johndoe@app.com
              password: 123456
              phone: "+1234567890"
      responses:
        201:
          $ref: "#/components/responses/UserSingle"

  /users/{id}:
    get:
      tags: [Users]
      summary: Get user by ID (Admin only)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        200:
          $ref: "#/components/responses/UserSingle"
        404:
          description: User not found
    patch:
      tags: [Users]
      summary: Update user (Admin only)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdate"
      responses:
        200:
          $ref: "#/components/responses/UserSingle"
    delete:
      tags: [Users]
      summary: Delete user (Admin only)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        204:
          description: User deleted

  /users/me:
    get:
      tags: [Users]
      summary: Get current user
      security:
        - bearerAuth: []
      responses:
        200:
          $ref: "#/components/responses/UserSingle"



components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    page:
      name: page
      in: query
      schema:
        type: integer
        default: 1
    limit:
      name: limit
      in: query
      schema:
        type: integer
        default: 10

  schemas:
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
        password:
          type: string
      example:
        email: user@app.com
        password: 123456

    AuthResponse:
      type: object
      properties:
        success:
          type: boolean
        token:
          type: string

    User:
      type: object
      properties:
        _id:
          type: string
        name:
          type: string
        email:
          type: string
        isActive:
          type: boolean
        role:
          type: string
          enum: [admin, user]
      example:
        _id: "60c72b2f9b1e8e001c8e4b8a"
        name: John Doe
        email: johndoe@app.com
        isActive: true
        role: user

    UserCreate:
      type: object
      required: [name, email, password]
      properties:
        name:
          type: string
        email:
          type: string
        password:
          type: string
      example:
        name: John Doe
        email: johndoe@app.com
        password: 123456
    
    UserUpdate:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
        password:
          type: string
        isActive:
          type: boolean
        role:
          type: string
          enum: [admin, user]
      example:
        name: John Doe
        email: johndoe@app.com
        password: 123456
        isActive: true
        role: user


  responses:
    SuccessAuth:
      description: Successful authentication
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
              token:
                type: string
              user:
                $ref: "#/components/schemas/User"
          example:
            success: true
            token: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpZCI6IjYwYzcyYjJmOWIxZThlMDAxYzhlNGI4YSIsImlhdCI6MTYyMzQ1NjAwMH0.sflKxwRJSMeKKF2QT4fwpMeJf36POk6yJV_adQssw5c"
            user:
              _id: "60c72b2f9b1e8e001c8e4b8a"
              name: John Doe
              email: johndoe@app.com
              isActive: true
              role: user

    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
              message:
                type: string

    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
              message:
                type: string

    UserSingle:
      description: Single user response
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/User"

    UserList:
      description: User list response
      content:
        application/json:
          schema:
            type: object
            properties:
              users:
                type: array
                items:
                  $ref: "#/components/schemas/User"
              total:
                type: integer
              page:
                type: integer
              limit:
                type: integer

